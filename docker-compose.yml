
# Usage:
# 1. Create config.py next to this file (python configproxy.py create --filename config.py) with:
#    - SQLALCHEMY_DATABASE_URI = "postgresql://proto3:proto3@postgres/proto3"
#    - CELERY_BROKER_URL = "redis://redis:6379/0"
#    - DOCUMENTS_PATH = "/data/documents"
# 2. docker compose up --build

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proto3
      POSTGRES_USER: proto3
      POSTGRES_PASSWORD: proto3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proto3"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.py:/app/config.py:ro
      - ./uwsgi.ini:/app/uwsgi.ini:ro
      - documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    restart: unless-stopped
    command: celery -A server.celery worker --loglevel=info --concurrency=4
    volumes:
      - ./config.py:/app/config.py:ro
      - documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  documents:

