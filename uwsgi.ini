# Example uwsgi.ini (used for dev)

[uwsgi]
http = :8000
master =
workers = 4
harakiri = 30
buffer-size = 32768
die-on-term =

cheaper = 1
cheaper-algo = spare
cheaper-overload = 1
cheaper-initial = 1
cheaper-step = 1

enable-threads =
single-interpreter = true

mule =
chdir = /app
wsgi-file = /app/server.py
callable = app
pyargv = server.py
mount = /=/app/server.py
manage-script-name =

log-date =
log-4xx =
log-5xx =
log-x-forwarded-for =
