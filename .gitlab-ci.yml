.build-image:
    stage: deploy
    timeout: 1h
    image:
        name: quay.io/buildah/stable
    variables:
        GIT_SUBMODULE_STRATEGY: recursive
        GIT_SUBMODULE_FORCE_HTTPS: "true"
        STORAGE_DRIVER: vfs
        BUILDAH_ISOLATION: chroot
        BUILDAH_FORMAT: docker
    script:
        - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        - >-
            buildah build
            --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
            --build-arg GIT_COMMIT_TIMESTAMP="$CI_COMMIT_TIMESTAMP"
            --tag "$IMAGE_NAME:$CI_COMMIT_SHA"
            .
        - |
            for tag in $IMAGE_TAGS; do
                buildah tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:$tag"
            done
        - |
            for tag in $CI_COMMIT_SHA $IMAGE_TAGS; do
                buildah push "$IMAGE_NAME:$tag"
            done


deploy-development:
    extends: .build-image
    rules:
        - if: $CI_COMMIT_TAG == null
    variables:
        IMAGE_NAME: $CI_REGISTRY_IMAGE/development
        IMAGE_TAGS: latest


deploy-production:
    extends: .build-image
    rules:
        - if: $CI_COMMIT_TAG != null
    variables:
        IMAGE_NAME: $CI_REGISTRY_IMAGE/production
        IMAGE_TAGS: $CI_COMMIT_TAG latest
